<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop Rental & Code Activation</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #111;
            color: white;
            padding: 30px;
        }

        h1, h2 {
            text-align: center;
            color: #00ffff;
        }

        .section {
            margin: 20px 0;
        }

        .code-entry {
            margin: 20px 0;
            text-align: center;
        }

        input {
            padding: 10px;
            font-size: 16px;
            border-radius: 5px;
            border: 1px solid #00ffff;
            background: #333;
            color: white;
            text-align: center;
            width: 200px;
        }

        button {
            background-color: #00ffff;
            color: black;
            padding: 10px;
            font-size: 16px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #00cccc;
        }

        .message {
            margin-top: 20px;
            font-size: 18px;
        }

        .container {
            background: #222;
            padding: 20px;
            border-radius: 10px;
            display: inline-block;
            margin: 20px;
            width: 300px;
        }

        .button {
            background-color: #00ffff;
            color: black;
            padding: 15px;
            text-decoration: none;
            font-size: 20px;
            border-radius: 5px;
            display: block;
            margin: 10px auto;
            width: 80%;
        }

        .button:hover {
            background-color: #00cccc;
        }

        .price {
            font-size: 18px;
            font-weight: bold;
            color: #00ff00;
        }
    </style>
</head>
<body>
    <h1>Shop Rental & Code Activation</h1>

    <!-- Rent Shop Section -->
    <div class="section">
        <h2>🔑 Rent Your Shop</h2>

        <div class="container">
            <h3>🏪 Rent a Shop</h3>
            <p>Rent your shop for 6 months for <span class="price" id="rentPrice">$20</span>.</p>
            <a class="button" href="https://www.paypal.me/ZanoGarblie/20" target="_blank">Rent Now</a>
        </div>

        <div class="container">
            <h3>🏪 Buy a Shop</h3>
            <p>Buy your shop for <span class="price" id="buyPrice">$50</span>.</p>
            <a class="button" href="https://www.paypal.me/ZanoGarblie/50" target="_blank">Buy Now</a>
        </div>

        <p>Note: The rental is valid for 6 months due to limited space.</p>
    </div>

    <!-- Code Activation Section -->
    <div class="section">
        <h2>🔓 Unlock Features with Your Code</h2>
        <div class="code-entry">
            <input type="text" id="codeInput" placeholder="Enter your unlock code" />
            <button onclick="unlockCode()">Unlock</button>
        </div>

        <div id="message" class="message"></div>
    </div>

    <script>
        // The valid unlock codes
        const unlockCodes = {
            '7rpbm6rci': 'https://pastebin.com/AkL214xY',
            '3fftufscu': 'https://pastebin.com/hfDzuB46',
            'i9umzcuyi': 'https://pastebin.com/t9Khr6zY',
            'ldn5yk1pq': 'https://pastebin.com/0Kh9VYad',
            'zg3bk3es8': 'https://pastebin.com/jGpUV6Py',
            'tzwuyh0hl': 'https://pastebin.com/n2tD8yUF',
            '6u2mrywf9': 'https://pastebin.com/UwQb799C',
            '68q53ez36': 'https://pastebin.com/9iTDB0d2',
            '2hy3igfa9': 'https://pastebin.com/geVqPnyt',
            'v2pg6q066': 'https://pastebin.com/DJYvF3ii'
        };

        // Codes that give a 1-month extension
        const activationCodes = [
            'FREE_101f56c9eda7b99fabddfc095ce5833d',
            'FREE_55eff101f3e34ee0522c8a2278afaca2',
            'FREE_1b08b8eafea259c9973bef4ce7aad975',
            'FREE_bad134bdddc1aaf68cb910331ae7ef31'
        ];

        // Handle code input
        function unlockCode() {
            let codeInput = document.getElementById('codeInput').value.trim();
            let messageElement = document.getElementById('message');

            // Check if the entered code is valid and not used
            if (localStorage.getItem(codeInput)) {
                messageElement.innerHTML = '❌ This code has already been used!';
                messageElement.style.color = 'red';
            } else if (unlockCodes[codeInput]) {
                // Redirect to the corresponding Pastebin link
                window.location.href = unlockCodes[codeInput];
                localStorage.setItem(codeInput, 'used'); // Mark as used
                messageElement.innerHTML = 'Redirecting... Check the page for the activation code!';
                messageElement.style.color = 'green';
            } else if (activationCodes.includes(codeInput)) {
                localStorage.setItem(codeInput, 'used'); // Mark as used
                messageElement.innerHTML = '✅ 1-Month Extension Activated! Enjoy your extra time!';
                messageElement.style.color = 'green';
            } else {
                messageElement.innerHTML = '❌ Invalid Code! Please try again.';
                messageElement.style.color = 'red';
            }
        }
    </script>
</body>
</html>
